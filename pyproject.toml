[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wraw"
version = "1.0.0"
description = "A cross-platform reader for Waters MassLynx .raw directories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
